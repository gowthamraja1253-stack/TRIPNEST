version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: tripnest-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tripnestdatabase}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - tripnest-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: tripnest-backend
    depends_on:
      - database
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${POSTGRES_DB:-tripnestdatabase}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - UNSPLASH_API_KEY=${UNSPLASH_API_KEY}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    ports:
      - "8080:8080"
    networks:
      - tripnest-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tripnest-frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - tripnest-network

volumes:
  pgdata:

networks:
  tripnest-network:
    driver: bridge
