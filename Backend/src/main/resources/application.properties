server.port=${PORT:8080}

spring.application.name=tripnest
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:your_github_client_id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your_github_client_secret}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tripnest}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:your_super_secret_jwt_key_that_is_long_enough_for_hmac_sha256}
app.jwt.expiration-ms=86400000

apis.gemini.key=${GEMINI_API_KEY:your_gemini_api_key_here}
apis.unsplash.key=${UNSPLASH_API_KEY:YOUR_UNSPLASH_API_KEY_HERE}
apis.openweather.key=${OPENWEATHER_API_KEY:YOUR_OPENWEATHER_API_KEY_HERE}

cloudinary.url=${CLOUDINARY_URL:cloudinary://my_key:my_secret@my_cloud_name}
